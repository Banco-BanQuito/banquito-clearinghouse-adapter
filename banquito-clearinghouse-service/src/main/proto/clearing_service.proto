syntax = "proto3";

package banquito.clearing.v2;

option java_multiple_files = true;
option java_package = "ec.edu.espe.banquito.switchpayments.banquitoclearinghouseservice.grpc.clearing";
option java_outer_classname = "ClearingServiceProto";

service ClearingService {
  rpc RegisterOffUsPayment(OffUsPaymentRequest) returns (OffUsPaymentResponse);
}

message OffUsPaymentRequest {
  string batch_id = 1;
  string transaction_id = 2;
  string routing_code = 3;
  string origin_account = 4;
  string destination_account = 5;
  string amount = 6;
  string currency = 7;
  string concept = 8;
  string value_date = 9;
}

message OffUsPaymentResponse {
  string status = 1;
  string batch_id = 2;
  string transaction_id = 3;
  string message = 4;
}
