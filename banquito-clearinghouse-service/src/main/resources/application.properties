spring.application.name=banquito-clearinghouse-service
server.port=${SERVER_PORT:8087}
clearing.grpc.port=${CLEARING_GRPC_PORT:9094}

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI}

spring.mongodb.host=${MONGODB_HOST}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.database=${MONGODB_DATABASE}

gcp.project-id=${GCP_PROJECT_ID:}
pubsub.project-id=${PUBSUB_PROJECT_ID:${gcp.project-id}}
secret-manager.health-check.probe-secret-ref=${SECRET_MANAGER_HEALTHCHECK_SECRET_REF:banquito-secret-manager-healthcheck}
pubsub.subscription.clearing-outbound=${PUBSUB_SUBSCRIPTION_CLEARING_OUTBOUND:clearing-outbound-sub}
pubsub.subscription.off-us=${PUBSUB_SUBSCRIPTION_PAYMENT_LINES_OFFUS:payment-lines-offus-sub}
pubsub.topic.interbank-payments-received=${PUBSUB_TOPIC_INTERBANK_PAYMENTS_RECEIVED:interbank-payments-received}
pubsub.subscription.interbank-payments-received=${PUBSUB_SUBSCRIPTION_INTERBANK_PAYMENTS_RECEIVED:interbank-payments-received-sub}
clearing.pubsub-listener.enabled=${CLEARING_PUBSUB_LISTENER_ENABLED:false}

core.service.settlement-url=${CORE_GATEWAY_URL}/api/v2/payments/offus-settlement
core.service.inbound-credit-url=${CORE_GATEWAY_URL}/api/v2/payments/inbound-credit

clearing.banks.own-routing-code=${BANQUITO_ROUTING_CODE:001}
clearing.banks.banquil.bank-code=${BANQUIL_BANK_CODE:BANQUIL}
clearing.banks.banquil.routing-codes=${BANQUIL_ROUTING_CODES:002}
clearing.banks.banquil.endpoint-url=${BANQUIL_ENDPOINT_URL:http://localhost:${SERVER_PORT:8087}/mock/banks/banquil/payments}
clearing.banks.banquil.api-key-header-name=${BANQUIL_API_KEY_HEADER_NAME:x-api-key}
clearing.banks.banquil.api-key=${BANQUIL_API_KEY:}
clearing.banks.banquil.bearer-token=${BANQUIL_BEARER_TOKEN:}
clearing.banks.banquil.timeout-seconds=${BANQUIL_TIMEOUT_SECONDS:10}

clearing.banks.bank003.bank-code=${BANK003_BANK_CODE:BANK003}
clearing.banks.bank003.routing-codes=${BANK003_ROUTING_CODES:003}
clearing.banks.bank003.endpoint-url=${BANK003_ENDPOINT_URL:https://34.117.178.114.nip.io/api/b2b/v2/interbank/payment}
clearing.banks.bank003.bearer-token=${BANK003_BEARER_TOKEN:}
clearing.banks.bank003.token-url=${BANK003_TOKEN_URL:}
clearing.banks.bank003.client-id=${BANK003_CLIENT_ID:}
clearing.banks.bank003.client-secret=${BANK003_CLIENT_SECRET:}
clearing.banks.bank003.timeout-seconds=${BANK003_TIMEOUT_SECONDS:10}

compensation.output.dir=${COMPENSATION_OUTPUT_DIR:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.mongodb.enabled=${MANAGEMENT_HEALTH_MONGO_ENABLED:false}

logging.level.root=INFO
logging.level.org.springframework.data.mongodb=INFO
